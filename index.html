            {imp.isTxt && (<>
              <div style={s('display:flex;justify-content:space-between;align-items:center;margin-top:4px')}>
                {backBtn('‹ Sources', v.impBack)}
                <span style={s(`font:700 16px 'Bricolage Grotesque',sans-serif`)}>Fichier Maille</span><span style={{ width: 80 }}></span>
              </div>
              {!imp.fm && (
                <div style={s(`border-radius:24px;padding:18px;background:${t.surface};display:flex;flex-direction:column;gap:12px`)}>
                  <div style={s(`font:700 18px 'Bricolage Grotesque',sans-serif`)}>Choisissez un fichier texte</div>
                  <div style={s(`font-size:13px;line-height:1.5;color:${t.muted}`)}>Un fichier .txt avec un ou plusieurs patterns. Vous pouvez relire et modifier le texte avant de l’ajouter.</div>
                  <button onClick={imp.pickTxt} style={s(`height:52px;border-radius:26px;border:0;background:oklch(0.75 0.15 350);color:#2a2233;font:700 15px 'DM Sans';cursor:pointer`)}>Choisir un fichier</button>
                </div>
              )}
              {imp.fm && (<>
                <div style={s('display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px')}>
                  <span style={s(`flex:1;min-width:0;font:600 13px 'DM Sans';color:${t.muted};overflow:hidden;text-overflow:ellipsis;white-space:nowrap`)}>{imp.fm.name}</span>
                  <button onClick={imp.pickTxt} style={s(`flex:none;height:36px;padding:0 14px;border-radius:18px;border:0;background:${t.chip};color:${t.ink};font:600 13px 'DM Sans';cursor:pointer`)}>Changer</button>
                </div>
                {imp.fmBlocks.map((b, i) => (
                  <div key={i} style={s(`flex:none;border-radius:18px;padding:10px 12px;background:${t.surface};display:flex;flex-direction:column;gap:10px`)}>
                    <div style={s('display:flex;gap:10px;align-items:center')}>
                      <button onClick={b.toggle} role="checkbox" aria-checked={b.on} aria-disabled={!b.ok} style={s(`flex:1;min-width:0;cursor:${b.ok ? 'pointer' : 'default'};border:0;padding:0;background:transparent;text-align:left;color:${t.ink};display:flex;gap:12px;align-items:center`)}>
                        <span style={s(`flex:none;width:26px;height:26px;border-radius:9px;border:2px solid ${b.boxBorder};background:${b.boxBg};color:#2a2233;display:flex;align-items:center;justify-content:center;font:700 14px 'DM Sans'`)}>{b.on ? '✓' : ''}</span>
                        <span style={s('flex:1;min-width:0;display:flex;flex-direction:column;gap:3px')}>
                          <span style={s(`font:700 15px 'DM Sans'`)}>{b.name}</span>
                          <span style={s(`font-size:12px;color:${t.muted}`)}>{b.meta}</span>
                          <span style={s('display:flex;gap:3px')}>{b.yarnDots.map((y, j) => <span key={j} title={y.name} style={s(`width:11px;height:11px;border-radius:6px;background:${y.hex}`)}></span>)}</span>
                        </span>
                      </button>
                      <button onClick={b.toggleOpen} aria-expanded={b.open} style={s(`flex:none;height:36px;padding:0 14px;border-radius:18px;border:0;background:${t.chip};color:${t.ink};font:600 13px 'DM Sans';cursor:pointer`)}>{b.open ? 'Fermer' : 'Modifier'}</button>
                    </div>
                    {b.open && <textarea value={b.raw} onChange={b.onRaw} aria-label={`Texte de ${b.name}`} style={s(`width:100%;min-height:300px;resize:vertical;border:0;border-radius:14px;padding:12px;background:${t.chip};color:${t.ink};font:400 13px/1.6 ui-monospace,Menlo,monospace;outline:none`)}></textarea>}
                  </div>
                ))}
                <button onClick={imp.fmAdd} style={s(`height:56px;flex:none;border-radius:28px;border:0;background:${imp.fmCtaBg};color:${imp.fmCtaColor};font:700 16px 'DM Sans';cursor:pointer`)}>{imp.fmCta}</button>
              </>)}
              {imp.fmErr && <div role="alert" style={s(`font-size:13px;line-height:1.4;border-radius:14px;padding:10px 12px;background:oklch(0.9 0.08 60);color:#4a2e10`)}>{imp.fmErr}</div>}
            </>)}
            {imp.isPdf && (<>
              <div style={s('display:flex;justify-content:space-between;align-items:center;margin-top:4px')}>
                {backBtn('‹ Sources', v.impBack)}
                <span style={s(`font:700 16px 'Bricolage Grotesque',sans-serif`)}>Import PDF</span><span style={{ width: 80 }}></span>
              </div>
              {!imp.pdf && (
                <div style={s(`border-radius:24px;padding:18px;background:${t.surface};display:flex;flex-direction:column;gap:12px`)}>
                  <div style={s(`font:700 18px 'Bricolage Grotesque',sans-serif`)}>Choisissez un PDF</div>
                  <div style={s(`font-size:13px;line-height:1.5;color:${t.muted}`)}>Pattern acheté, livre, magazine… Le texte est lu directement sur votre appareil, puis vous le vérifiez avant d’enregistrer.</div>
                  {imp.pdfBusy
                    ? <div style={s(`font:600 14px 'DM Sans';padding:8px 0`)}>{imp.pdfReadLabel}</div>
                    : <button onClick={imp.pickPdf} style={s(`height:52px;border-radius:26px;border:0;background:oklch(0.75 0.15 350);color:#2a2233;font:700 15px 'DM Sans';cursor:pointer`)}>Choisir un PDF</button>}
                </div>
              )}
              {imp.pdf && (<>
                <div style={s(`display:flex;gap:14px;align-items:center;background:${t.surface};border-radius:22px;padding:14px`)}>
                  <div aria-hidden="true" style={s(`width:54px;height:68px;flex:none;border-radius:10px;background:repeating-linear-gradient(135deg,oklch(0.9 0.06 350) 0 6px,oklch(0.86 0.07 350) 6px 12px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:700 10px 'DM Sans';color:#2a2233`)}>PDF</div>
                  <div style={s('flex:1;min-width:0')}><div style={s(`font:700 15px 'DM Sans';overflow:hidden;text-overflow:ellipsis;white-space:nowrap`)}>{imp.pdf.name}</div><div style={s(`font-size:12px;color:${t.muted};margin-top:3px`)}>{imp.pdfPagesLabel}</div></div>
                  {!imp.pdfBusy && <button onClick={imp.pickPdf} style={s(`flex:none;height:36px;padding:0 14px;border-radius:18px;border:0;background:${t.chip};color:${t.ink};font:600 13px 'DM Sans';cursor:pointer`)}>Changer</button>}
                </div>
                <div style={s(`border-radius:22px;padding:14px;background:${t.surface};display:flex;flex-direction:column;gap:10px`)}>
                  <span style={s(`font:700 14px 'DM Sans'`)}>Pages à lire</span>
                  <div style={s('display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px')}>
                    {field('De la page', imp.pdf.from, imp.onFrom, { type: 'number', readOnly: imp.pdfBusy })}
                    {field('À la page', imp.pdf.to, imp.onTo, { type: 'number', readOnly: imp.pdfBusy })}
                  </div>
                  <div style={s(`font-size:12px;line-height:1.45;color:${t.muted}`)}>Pour un livre avec plusieurs modèles, indiquez seulement les pages du modèle voulu : vous l’enregistrez, puis vous recommencez pour le suivant. Ce sont les numéros du fichier, parfois décalés de ceux imprimés : vérifiez avec l’aperçu.</div>
                  {imp.pdfThumb && (
                    <div style={s('display:flex;gap:12px;align-items:flex-start')}>
                      <img src={imp.pdfThumb} alt={`Aperçu de la page ${imp.pdfThumbN}`} style={s(`width:120px;flex:none;border-radius:10px;box-shadow:0 0 0 1px ${t.chip}`)} />
                      <span style={s(`font:600 12px 'DM Sans';color:${t.muted}`)}>Aperçu de la page {imp.pdfThumbN}</span>
                    </div>
                  )}
                </div>
                {imp.pdfBusy && (
                  <div style={s('display:flex;flex-direction:column;gap:8px;padding:4px')}>
                    <div style={s(`display:flex;justify-content:space-between;gap:10px;font:600 14px 'DM Sans'`)}><span>{imp.pdfReadLabel}</span><span>{imp.progress} %</span></div>
                    <div style={s(`height:8px;border-radius:4px;background:${t.chip};overflow:hidden`)}><div style={s(`height:100%;width:${imp.progress}%;background:oklch(0.75 0.15 350);transition:width .3s`)}></div></div>
                  </div>
                )}
                {!imp.pdfBusy && <button onClick={imp.readPdf} style={s(`height:56px;flex:none;border-radius:28px;border:0;background:oklch(0.75 0.15 350);color:#2a2233;font:700 16px 'DM Sans';cursor:pointer`)}>Lire le texte</button>}
              </>)}
              {imp.pdfErr && <div role="alert" style={s(`font-size:13px;line-height:1.4;border-radius:14px;padding:10px 12px;background:oklch(0.9 0.08 60);color:#4a2e10`)}>{imp.pdfErr}</div>}
            </>)}
            {imp.isPhoto && (<>
              <div style={s('display:flex;justify-content:space-between;align-items:center;margin-top:4px')}>
                {backBtn('‹ Sources', v.impBack)}
                <span style={s(`font:700 16px 'Bricolage Grotesque',sans-serif`)}>Import photo</span><span style={{ width: 80 }}></span>
              </div>
              {imp.noPhoto && (
                <div style={s(`border-radius:24px;padding:18px;background:${t.surface};display:flex;flex-direction:column;gap:12px`)}>
                  <div style={s(`font:700 18px 'Bricolage Grotesque',sans-serif`)}>Photographiez la page du pattern</div>
                  <div style={s(`font-size:13px;line-height:1.5;color:${t.muted}`)}>Page à plat, bien éclairée, sans ombre. Le texte est lu automatiquement, puis vous le vérifiez avant d’enregistrer.</div>
                  <button onClick={imp.pickPhoto} style={s(`height:52px;border-radius:26px;border:0;background:oklch(0.75 0.15 350);color:#2a2233;font:700 15px 'DM Sans';cursor:pointer`)}>Choisir une photo</button>
                </div>
              )}
              {imp.hasPhoto && (<>
                <div style={s('border-radius:24px;overflow:hidden;background:#16121a;height:380px;flex:none;display:flex;align-items:center;justify-content:center')}>
                  <div style={s(`width:${imp.boxW}px;height:${imp.boxH}px;background-size:contain;background-repeat:no-repeat;background-position:center;transform:rotate(${imp.rot}deg);transition:transform .25s`, { backgroundImage: imp.photoBg })}></div>
                </div>
                <div style={s('display:flex;gap:8px')}>
                  <button onClick={imp.rotL} title="Pivoter à gauche" aria-label="Pivoter à gauche" style={s(`width:46px;height:46px;border-radius:23px;border:0;background:${t.chip};color:${t.ink};font:600 18px 'DM Sans';cursor:pointer`)}>↺</button>
                  <button onClick={imp.rotR} title="Pivoter à droite" aria-label="Pivoter à droite" style={s(`width:46px;height:46px;border-radius:23px;border:0;background:${t.chip};color:${t.ink};font:600 18px 'DM Sans';cursor:pointer`)}>↻</button>
                  <button onClick={imp.clearPhoto} style={s(`height:46px;padding:0 16px;border-radius:23px;border:0;background:${t.chip};color:${t.ink};font:600 14px 'DM Sans';cursor:pointer`)}>Changer</button>
                </div>
                {imp.reading && (
                  <div style={s('display:flex;flex-direction:column;gap:8px;padding:4px')}>
                    <div style={s(`display:flex;justify-content:space-between;font:600 14px 'DM Sans'`)}><span>{imp.readLabel}</span><span>{imp.progress} %</span></div>
                    <div style={s(`height:8px;border-radius:4px;background:${t.chip};overflow:hidden`)}><div style={s(`height:100%;width:${imp.progress}%;background:oklch(0.75 0.15 350);transition:width .3s`)}></div></div>
                  </div>
                )}
                {imp.canRead && <button onClick={imp.read} style={s(`height:56px;flex:none;border-radius:28px;border:0;background:oklch(0.75 0.15 350);color:#2a2233;font:700 16px 'DM Sans';cursor:pointer`)}>Lire le texte</button>}
                <div style={s(`display:${imp.errDisplay};font-size:13px;line-height:1.4;border-radius:14px;padding:10px 12px;background:oklch(0.9 0.08 60);color:#4a2e10`)}>{imp.err}</div>
              </>)}
            </>)}
            {imp.isPaste && (<>
              <div style={s('display:flex;justify-content:space-between;align-items:center;margin-top:4px')}>
                {backBtn('‹ Sources', v.impBack)}
                <button onClick={v.save} style={s(`height:40px;padding:0 16px;border-radius:20px;border:0;background:${v.saveBg};color:${v.saveColor};font:700 14px 'DM Sans';cursor:pointer`)}>Enregistrer</button>
              </div>
              {v.draftHasPhoto && (
                <div style={s(`display:flex;gap:12px;align-items:center;border-radius:18px;padding:10px;background:${t.surface}`)}>
                  <div style={s('flex:none;width:52px;height:68px;border-radius:10px;background-size:cover;background-position:center top', { backgroundImage: v.draftPhotoBg })}></div>
                  <div style={s(`font-size:13px;line-height:1.4;color:${t.muted}`)}><b style={{ color: t.ink }}>Texte lu depuis {v.draft.from || 'la photo'}.</b> Vérifiez l’aperçu et corrigez dans « Texte source » si besoin. Cette image deviendra la couverture.</div>
                </div>
              )}
              <input value={v.draft.name} onChange={v.onName} placeholder="Nom du pattern" aria-label="Nom du pattern" style={s(`border:0;background:transparent;outline:none;font:800 30px 'Bricolage Grotesque',sans-serif;color:${t.ink};padding:4px 0;width:100%`)} />
              <div style={s('display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px')}>
                {field('Créatrice / source', v.draft.designer, v.onDesigner, { placeholder: 'ex. Blog Fil & Thé' })}
                {field('Crochet', v.draft.hook, v.onHook, { placeholder: '3 mm' })}
              </div>
              {catChipRow(v.catChips)}
              {newCatRow}
              {diffRow(v.diffChips)}
              <div style={s('display:flex;flex-direction:column;gap:6px')}>
                <span style={s(`font:600 13px 'DM Sans'`)}>Terminologie du texte collé</span>
                <div style={s(`display:grid;grid-template-columns:repeat(3,1fr);background:${t.chip};border-radius:14px;padding:4px`)}>
                  {v.termChips.map(tm => <button key={tm.k} onClick={tm.onClick} style={s(`height:36px;border-radius:11px;border:0;background:${tm.bg};color:${t.ink};font:600 13px 'DM Sans';cursor:pointer`)}>{tm.label}</button>)}
                </div>
              </div>
              <div style={s(`display:grid;grid-template-columns:1fr 1fr;background:${t.chip};border-radius:16px;padding:4px`)}>
                <button onClick={v.tabSource} style={s(`height:38px;border-radius:12px;border:0;background:${v.srcTabBg};color:${t.ink};font:600 14px 'DM Sans';cursor:pointer`)}>Texte source</button>
                <button onClick={v.tabPreview} style={s(`height:38px;border-radius:12px;border:0;background:${v.prevTabBg};color:${t.ink};font:600 14px 'DM Sans';cursor:pointer`)}>Aperçu · {v.parsedRowCount} rangs</button>
              </div>
              {v.isSourceTab && (<>
                <textarea value={v.draft.raw} onChange={v.onRaw} aria-label="Texte source" placeholder="Collez le pattern ici. Une ligne par rang : « Rnd 2: [2 dc into next st] 6 times. 12 sts. »" style={s(`width:100%;min-height:230px;flex:none;resize:vertical;border:0;border-radius:18px;padding:14px;background:${t.surface};color:${t.ink};font-size:14px;line-height:1.55;outline:none`)}></textarea>
                <button onClick={v.pasteExample} style={s(`align-self:flex-start;height:38px;padding:0 14px;border-radius:19px;border:0;background:${t.chip};color:${t.ink};font:600 13px 'DM Sans';cursor:pointer`)}>Coller un exemple</button>
              </>)}
              {v.isPreviewTab && (<>
                <div style={s(`font-size:13px;color:${t.muted}`)}>{v.previewSummary}</div>
                <div style={s('display:flex;flex-direction:column;gap:4px')}>
                  {v.preview.map((r, i) => r.isSection
                    ? <div key={i} style={s(`font:700 17px 'Bricolage Grotesque',sans-serif;padding:10px 4px 2px`)}>{r.plain}</div>
                    : r.isNote
                    ? <div key={i} style={s(`font-size:13px;font-style:italic;color:${t.muted};padding:2px 4px 2px 54px`)}>{r.plain}</div>
                    : (
                    <div key={i} style={s(`display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;background:${t.surface}`)}>
                      <span style={s(`flex:none;min-width:40px;text-align:center;font:700 12px 'DM Sans';padding:4px 6px;border-radius:9px;background:${t.chip}`)}>{r.label}</span>
                      <span style={s('flex:1;font-size:14px;line-height:1.45')}>{hlText(r.parts)}</span>
                      <span style={s(`flex:none;font:600 12px 'DM Sans';color:${t.muted};padding-top:2px`)}>{r.count}</span>
                    </div>
                    ))}
                </div>
              </>)}
            </>)}
          </div>
          )}

          {/* ── Glossaire ── */}
          {v.isGlossary && (
          <div className="scr" style={s('flex:1;overflow-y:auto;padding:6px 20px 110px;display:flex;flex-direction:column;gap:12px')}>
            <div style={s(`font:800 34px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin:8px 0 2px`)}>Glossaire</div>
            <div style={s(`font-size:14px;color:${t.muted}`)}>Français · US · UK. Touchez un point pour le détail.</div>
            <div style={s(`display:flex;align-items:center;gap:10px;background:${t.chip};border-radius:16px;padding:0 16px;height:46px;flex:none`)}>
              <span aria-hidden="true" style={s(`color:${t.muted};font-size:17px`)}>⌕</span>
              <input value={v.gq} onChange={v.onGq} placeholder="ms, dc, htr, picot…" aria-label="Rechercher un point" style={s(`flex:1;min-width:0;border:0;background:transparent;font-size:15px;outline:none;color:${t.ink}`)} />
            </div>
            {v.gloss.map(g => (
              <div key={g.fr} style={s(`border-radius:20px;padding:14px 16px;background:${g.bg};color:${t.ink};display:flex;flex-direction:column;gap:8px`)}>
              <button onClick={g.onClick} aria-expanded={g.open} style={s(`cursor:pointer;border:0;padding:0;background:transparent;text-align:left;color:${t.ink};display:flex;flex-direction:column;gap:8px;width:100%`)}>
                <div style={s('display:flex;align-items:center;gap:12px;width:100%')}>
                  <span style={s(`flex:none;min-width:64px;font:800 22px/1 'Bricolage Grotesque',sans-serif`)}>{g.fr}</span>
                  <span style={s(`flex:1;font:600 14px 'DM Sans';line-height:1.25`)}>{g.name}</span>
                  <span style={s(`display:${g.warnDisplay};flex:none;font:700 10px 'DM Sans';letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:8px;background:oklch(0.9 0.08 60);color:#4a2e10`)}>Piège</span>
                </div>
                <div style={s('display:flex;gap:6px;flex-wrap:wrap')}>
                  <span style={s(`font:600 12px 'DM Sans';padding:4px 9px;border-radius:9px;background:${t.pillOnTint}`)}>US · {g.us}</span>
                  <span style={s(`font:600 12px 'DM Sans';padding:4px 9px;border-radius:9px;background:${t.pillOnTint}`)}>UK · {g.uk}</span>
                </div>
              </button>
              {g.open && (<>
                <div style={s(`font-size:14px;line-height:1.45;color:${t.mutedOnTint}`)}>{g.desc}</div>
                {/* Ouvre une recherche YouTube en français : besoin d'internet */}
                <a href={g.videoUrl} target="_blank" rel="noopener noreferrer"
                  style={s(`align-self:flex-start;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;background:${t.pillOnTint};color:${t.ink};font:600 13px 'DM Sans';text-decoration:none`)}>
                  <span aria-hidden="true">▶</span>Voir une vidéo
                </a>
              </>)}
              </div>
            ))}
          </div>
          )}

          {/* ── Alerte modification ── */}
          {warn.show && (
          <div onClick={warn.cancel} style={s('position:absolute;inset:0;z-index:20;background:rgba(22,18,26,.45);display:flex;align-items:flex-end;padding:12px')}>
            <div onClick={warn.stop} role="dialog" aria-modal="true" aria-label={warn.title} style={s(`width:100%;border-radius:30px;padding:22px 20px 18px;background:${t.surface};color:${t.ink};display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px -10px rgba(0,0,0,.4)`)}>
              <div style={s(`font:800 22px/1.1 'Bricolage Grotesque',sans-serif`)}>{warn.title}</div>
              <div style={s(`font-size:14px;line-height:1.45;color:${t.muted}`)}>Modifier les tours peut décaler leur avancement. Vous pouvez travailler sur une copie à la place.</div>
              <div style={s('display:flex;flex-direction:column;gap:6px')}>
                {warn.projects.map(w => <div key={w.id} style={s(`display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 12px;border-radius:12px;background:${t.chip}`)}><span style={{ fontWeight: 600 }}>{w.title}</span><span style={{ color: t.muted }}>{w.info}</span></div>)}
              </div>
              <button onClick={warn.copy} style={s(`height:52px;border-radius:26px;border:0;background:oklch(0.75 0.15 350);color:#2a2233;font:700 15px 'DM Sans';cursor:pointer;margin-top:4px`)}>Créer une copie du pattern</button>
              <button onClick={warn.anyway} style={s(`height:48px;border-radius:24px;border:0;background:${t.chip};color:${t.ink};font:600 14px 'DM Sans';cursor:pointer`)}>Modifier quand même</button>
              <button onClick={warn.cancel} style={s(`height:44px;border-radius:22px;border:0;background:transparent;color:${t.muted};font:600 14px 'DM Sans';cursor:pointer`)}>Annuler</button>
            </div>
          </div>
          )}

          {/* ── Barre d'onglets ── */}
          {v.showTabs && (
          <nav style={s(`position:absolute;left:0;right:0;bottom:0;height:calc(64px + max(22px, env(safe-area-inset-bottom)));padding:8px 14px max(22px, env(safe-area-inset-bottom));background:${t.bar};backdrop-filter:blur(12px);display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid ${t.chip}`)}>
            {v.tabs.map(tb => (
              <button key={tb.k} onClick={tb.onClick} style={s(`border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:${tb.color}`)}>
                <span aria-hidden="true" style={s(`width:52px;height:30px;border-radius:15px;background:${tb.bg};display:flex;align-items:center;justify-content:center;font:800 15px 'Bricolage Grotesque',sans-serif`)}>{tb.glyph}</span>
                <span style={s(`font:600 11px 'DM Sans'`)}>{tb.label}</span>
              </button>
            ))}
          </nav>
          )}
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
