      if (ch === ';' && depth === 0) { parts.push(buf); buf = ''; } else buf += ch;
    }
    parts.push(buf);
    for (const p of parts) {
      const i = p.indexOf(':'); if (i < 0) continue;
      const k = p.slice(0, i).trim(), val = p.slice(i + 1).trim(); if (!k) continue;

    }
    if (_styleCache.size > 3000) _styleCache.clear();
    _styleCache.set(css, o);

  return extra ? { ...o, ...extra } : o;
}

            <div style={s(`font:800 34px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin:8px 0 16px`)}>Mes patterns</div>
            {v.hasResume && (
            <div onClick={resume.open} style={s(`cursor:pointer;border-radius:26px;padding:18px;background:${resume.strong};color:#2a2233;display:flex;flex-direction:column;gap:10px;margin-bottom:18px`)}>

              <div style={s('display:flex;gap:10px;align-items:baseline;background:rgba(255,255,255,.5);border-radius:16px;padding:10px 12px')}>

            <div style={s('display:grid;grid-template-columns:1fr 1fr;gap:12px')}>

                <button onClick={v.goBack} style={s(`flex:none;white-space:nowrap;height:40px;padding:0 14px 0 10px;border-radius:20px;border:0;background:${t.pillOnTint};color:${t.ink};font:600 14px 'DM Sans';cursor:pointer`)}>{v.backLabel}</button>

              </div>
              {cur.hasCtx && <div style={s(`display:flex;align-items:center;gap:8px;border-radius:14px;padding:8px 12px;background:${t.ink};color:${t.bg};font:600 13px 'DM Sans'`)}><span style={{ opacity: .65 }}>Projet</span><span style={s('flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap')}>{cur.ctxTitle}</span></div>}

                  <span style={s('flex:1;min-width:0;display:flex;flex-direction:column;gap:2px')}><span style={s(`font:600 14px 'DM Sans'`)}>{c.title}</span><span style={s(`font-size:12px;color:${t.muted}`)}>{c.sub}</span></span>

            </div>

            <div style={s(`position:sticky;top:0;z-index:2;background:${t.bg};padding:12px 0 10px;display:flex;flex-direction:column;gap:10px`)}>

                  <div style={s(`font:600 11px 'DM Sans';letter-spacing:.08em;text-transform:uppercase;color:${t.muted}`)}>{cur.sel.name} · {cur.sel.progressLabel}</div>

                </div>
                <button onClick={v.dec} aria-label="Tour précédent" style={s(`width:52px;height:52px;border-radius:26px;border:0;background:${t.chip};color:${t.ink};font:500 26px 'DM Sans';cursor:pointer`)}>−</button>
                <button onClick={v.inc} aria-label="Tour suivant" style={s(`width:52px;height:52px;border-radius:26px;border:0;background:${cur.strong};color:#2a2233;font:500 26px 'DM Sans';cursor:pointer`)}>+</button>
              </div>

            <div style={s('display:flex;flex-direction:column;gap:4px')}>

                  <span style={s('flex:1;display:flex;flex-direction:column;gap:6px')}>

                  <span style={s(`flex:none;font:600 13px 'DM Sans';color:${t.muted};padding-top:2px`)}>{r.count}</span>

          </div>

          {/* ── Modifier un pattern ── */}
          {v.isEdit && (<>
          <div style={s('flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 16px 8px')}>
            <button onClick={ed.cancel} style={s(`height:40px;padding:0 14px;border-radius:20px;border:0;background:${t.chip};color:${t.ink};font:600 14px 'DM Sans';cursor:pointer`)}>Annuler</button>
            <span style={s(`font:700 16px 'Bricolage Grotesque',sans-serif`)}>Modifications</span>
            <button onClick={ed.save} style={s(`height:40px;padding:0 16px;border-radius:20px;border:0;background:${ed.saveBg};color:${ed.saveColor};font:700 14px 'DM Sans';cursor:pointer`)}>Enregistrer</button>
          </div>
          <div className="scr" style={s('flex:1;overflow-y:auto;padding:4px 18px 40px;display:flex;flex-direction:column;gap:12px')}>

            <div style={s('display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px')}>

              {field('Livre / kit', ed.kit, ed.onKit, { placeholder: 'ex. Ricorumi Shrooom' })}
              {field('Page', ed.page, ed.onPage, { placeholder: 'ex. 24' })}

                  <input type="color" value={y.hex} onChange={y.onHex} aria-label="Couleur du fil" style={s('flex:none;width:40px;height:40px;border:0;border-radius:12px;padding:0;background:transparent;cursor:pointer')} />

                  <button onClick={y.remove} title="Retirer" aria-label="Retirer le fil" style={s(`flex:none;width:36px;height:36px;border-radius:18px;border:0;background:transparent;color:${t.muted};font:600 18px 'DM Sans';cursor:pointer`)}>×</button>
                </div>
              ))}
              <button onClick={ed.addYarn} style={s(`align-self:flex-start;height:36px;padding:0 14px;border-radius:18px;border:0;background:${t.chip};color:${t.ink};font:600 13px 'DM Sans';cursor:pointer`)}>+ Ajouter un fil</button>

            <div style={s('display:flex;flex-direction:column;gap:6px')}>

              <div style={s(`font-size:12px;line-height:1.45;color:${t.muted}`)}>Une ligne par tour : « T3 : *1 ms, 1 aug* x6 (18) ». Noms de pièce en MAJUSCULES. Les autres lignes deviennent des notes.</div>

            </div>
          </div>

            <div style={s(`display:grid;grid-template-columns:repeat(2,1fr);background:${t.chip};border-radius:16px;padding:4px`)}>
              {v.projTabs.map(pt => <button key={pt.k} onClick={pt.onClick} style={s(`height:40px;border-radius:12px;border:0;background:${pt.bg};color:${t.ink};font:600 14px 'DM Sans';cursor:pointer`)}>{pt.label} <span style={{ opacity: .5 }}>{pt.n}</span></button>)}

            {v.showStats && (

                </div>
              )}
              <input value={v.draft.name} onChange={v.onName} placeholder="Nom du pattern" aria-label="Nom du pattern" style={s(`border:0;background:transparent;outline:none;font:800 30px 'Bricolage Grotesque',sans-serif;color:${t.ink};padding:4px 0;width:100%`)} />
              <div style={s('display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px')}>
                {field('Créatrice / source', v.draft.designer, v.onDesigner, { placeholder: 'ex. Blog Fil & Thé' })}
                {field('Crochet', v.draft.hook, v.onHook, { placeholder: '3 mm' })}
              </div>
              {catChipRow(v.catChips)}
              {newCatRow}
              {diffRow(v.diffChips)}
              <div style={s('display:flex;flex-direction:column;gap:6px')}>
                <span style={s(`font:600 13px 'DM Sans'`)}>Terminologie du texte collé</span>
                <div style={s(`display:grid;grid-template-columns:repeat(3,1fr);background:${t.chip};border-radius:14px;padding:4px`)}>
                  {v.termChips.map(tm => <button key={tm.k} onClick={tm.onClick} style={s(`height:36px;border-radius:11px;border:0;background:${tm.bg};color:${t.ink};font:600 13px 'DM Sans';cursor:pointer`)}>{tm.label}</button>)}
                </div>
              </div>
              <div style={s(`display:grid;grid-template-columns:1fr 1fr;background:${t.chip};border-radius:16px;padding:4px`)}>
                <button onClick={v.tabSource} style={s(`height:38px;border-radius:12px;border:0;background:${v.srcTabBg};color:${t.ink};font:600 14px 'DM Sans';cursor:pointer`)}>Texte source</button>
                <button onClick={v.tabPreview} style={s(`height:38px;border-radius:12px;border:0;background:${v.prevTabBg};color:${t.ink};font:600 14px 'DM Sans';cursor:pointer`)}>Aperçu · {v.parsedRowCount} rangs</button>
              </div>
              {v.isSourceTab && (<>
                <textarea value={v.draft.raw} onChange={v.onRaw} aria-label="Texte source" placeholder="Collez le pattern ici. Une ligne par rang : « Rnd 2: [2 dc into next st] 6 times. 12 sts. »" style={s(`width:100%;min-height:230px;flex:none;resize:vertical;border:0;border-radius:18px;padding:14px;background:${t.surface};color:${t.ink};font-size:14px;line-height:1.55;outline:none`)}></textarea>
                <button onClick={v.pasteExample} style={s(`align-self:flex-start;height:38px;padding:0 14px;border-radius:19px;border:0;background:${t.chip};color:${t.ink};font:600 13px 'DM Sans';cursor:pointer`)}>Coller un exemple</button>
              </>)}
              {v.isPreviewTab && (<>
                <div style={s(`font-size:13px;color:${t.muted}`)}>{v.previewSummary}</div>
                <div style={s('display:flex;flex-direction:column;gap:4px')}>
                  {v.preview.map((r, i) => r.isSection
                    ? <div key={i} style={s(`font:700 17px 'Bricolage Grotesque',sans-serif;padding:10px 4px 2px`)}>{r.plain}</div>
                    : r.isNote
                    ? <div key={i} style={s(`font-size:13px;font-style:italic;color:${t.muted};padding:2px 4px 2px 54px`)}>{r.plain}</div>
                    : (
                    <div key={i} style={s(`display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;background:${t.surface}`)}>
                      <span style={s(`flex:none;min-width:40px;text-align:center;font:700 12px 'DM Sans';padding:4px 6px;border-radius:9px;background:${t.chip}`)}>{r.label}</span>
                      <span style={s('flex:1;font-size:14px;line-height:1.45')}>{hlText(r.parts)}</span>
                      <span style={s(`flex:none;font:600 12px 'DM Sans';color:${t.muted};padding-top:2px`)}>{r.count}</span>
                    </div>
                    ))}
                </div>
              </>)}
            </>)}
          </div>
          )}

          {/* ── Glossaire ── */}
          {v.isGlossary && (
          <div className="scr" style={s('flex:1;overflow-y:auto;padding:6px 20px 110px;display:flex;flex-direction:column;gap:12px')}>
            <div style={s(`font:800 34px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin:8px 0 2px`)}>Glossaire</div>
            <div style={s(`font-size:14px;color:${t.muted}`)}>Français · US · UK. Touchez un point pour le détail.</div>
            <div style={s(`display:flex;align-items:center;gap:10px;background:${t.chip};border-radius:16px;padding:0 16px;height:46px;flex:none`)}>
              <span aria-hidden="true" style={s(`color:${t.muted};font-size:17px`)}>⌕</span>
              <input value={v.gq} onChange={v.onGq} placeholder="ms, dc, htr, picot…" aria-label="Rechercher un point" style={s(`flex:1;min-width:0;border:0;background:transparent;font-size:15px;outline:none;color:${t.ink}`)} />
            </div>
            {v.gloss.map(g => (
              <button key={g.fr} onClick={g.onClick} aria-expanded={g.descDisplay === 'block'} style={s(`cursor:pointer;border:0;text-align:left;color:${t.ink};border-radius:20px;padding:14px 16px;background:${g.bg};display:flex;flex-direction:column;gap:8px`)}>
                <div style={s('display:flex;align-items:center;gap:12px;width:100%')}>
                  <span style={s(`flex:none;min-width:64px;font:800 22px/1 'Bricolage Grotesque',sans-serif`)}>{g.fr}</span>
                  <span style={s(`flex:1;font:600 14px 'DM Sans';line-height:1.25`)}>{g.name}</span>
                  <span style={s(`display:${g.warnDisplay};flex:none;font:700 10px 'DM Sans';letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:8px;background:oklch(0.9 0.08 60);color:#4a2e10`)}>Piège</span>
                </div>
                <div style={s('display:flex;gap:6px;flex-wrap:wrap')}>
                  <span style={s(`font:600 12px 'DM Sans';padding:4px 9px;border-radius:9px;background:${t.pillOnTint}`)}>US · {g.us}</span>
                  <span style={s(`font:600 12px 'DM Sans';padding:4px 9px;border-radius:9px;background:${t.pillOnTint}`)}>UK · {g.uk}</span>
                </div>
                <div style={s(`display:${g.descDisplay};font-size:14px;line-height:1.45;color:${t.mutedOnTint}`)}>{g.desc}</div>
              </button>
            ))}
          </div>
          )}

          {/* ── Alerte modification ── */}
          {warn.show && (
          <div onClick={warn.cancel} style={s('position:absolute;inset:0;z-index:20;background:rgba(22,18,26,.45);display:flex;align-items:flex-end;padding:12px')}>
            <div onClick={warn.stop} role="dialog" aria-modal="true" aria-label={warn.title} style={s(`width:100%;border-radius:30px;padding:22px 20px 18px;background:${t.surface};color:${t.ink};display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px -10px rgba(0,0,0,.4)`)}>
              <div style={s(`font:800 22px/1.1 'Bricolage Grotesque',sans-serif`)}>{warn.title}</div>
              <div style={s(`font-size:14px;line-height:1.45;color:${t.muted}`)}>Modifier les tours peut décaler leur avancement. Vous pouvez travailler sur une copie à la place.</div>
              <div style={s('display:flex;flex-direction:column;gap:6px')}>
                {warn.projects.map(w => <div key={w.id} style={s(`display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 12px;border-radius:12px;background:${t.chip}`)}><span style={{ fontWeight: 600 }}>{w.title}</span><span style={{ color: t.muted }}>{w.info}</span></div>)}
              </div>
              <button onClick={warn.copy} style={s(`height:52px;border-radius:26px;border:0;background:oklch(0.75 0.15 350);color:#2a2233;font:700 15px 'DM Sans';cursor:pointer;margin-top:4px`)}>Créer une copie du pattern</button>
              <button onClick={warn.anyway} style={s(`height:48px;border-radius:24px;border:0;background:${t.chip};color:${t.ink};font:600 14px 'DM Sans';cursor:pointer`)}>Modifier quand même</button>
              <button onClick={warn.cancel} style={s(`height:44px;border-radius:22px;border:0;background:transparent;color:${t.muted};font:600 14px 'DM Sans';cursor:pointer`)}>Annuler</button>
            </div>
          </div>
          )}

          {/* ── Barre d'onglets ── */}
          {v.showTabs && (
          <nav style={s(`position:absolute;left:0;right:0;bottom:0;height:calc(64px + max(22px, env(safe-area-inset-bottom)));padding:8px 14px max(22px, env(safe-area-inset-bottom));background:${t.bar};backdrop-filter:blur(12px);display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid ${t.chip}`)}>
            {v.tabs.map(tb => (
              <button key={tb.k} onClick={tb.onClick} style={s(`border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:${tb.color}`)}>
                <span aria-hidden="true" style={s(`width:52px;height:30px;border-radius:15px;background:${tb.bg};display:flex;align-items:center;justify-content:center;font:800 15px 'Bricolage Grotesque',sans-serif`)}>{tb.glyph}</span>
                <span style={s(`font:600 11px 'DM Sans'`)}>{tb.label}</span>
              </button>
            ))}
          </nav>
          )}
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  // Offline support (only works once the app is served over https, e.g. GitHub Pages).
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
